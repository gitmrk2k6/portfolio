<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI秘書Bot デモ</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
  background: #7494C0;
  height: 100vh;
  display: flex;
  flex-direction: column;
}
.header {
  background: #7494C0;
  color: white;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 15px;
  font-weight: 600;
}
.header-icon {
  width: 36px;
  height: 36px;
  background: #4A6FA5;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}
.chat-area {
  flex: 1;
  background: #7494C0;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.msg-row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.3s, transform 0.3s;
}
.msg-row.visible {
  opacity: 1;
  transform: translateY(0);
}
.msg-row.user {
  flex-direction: row-reverse;
}
.msg-row .time {
  font-size: 10px;
  color: rgba(255,255,255,0.7);
  white-space: nowrap;
  margin-bottom: 2px;
}
.bubble {
  max-width: 75%;
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 13px;
  line-height: 1.7;
  word-break: break-word;
  white-space: pre-wrap;
}
.bubble.bot {
  background: white;
  color: #333;
  border-bottom-left-radius: 4px;
}
.bubble.user {
  background: #5FB86A;
  color: white;
  border-bottom-right-radius: 4px;
}
.bot-icon {
  width: 32px;
  height: 32px;
  background: #4A6FA5;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}
.typing {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 12px 16px;
  background: white;
  border-radius: 18px;
  border-bottom-left-radius: 4px;
  max-width: 80px;
}
.typing span {
  width: 6px;
  height: 6px;
  background: #ccc;
  border-radius: 50%;
  animation: blink 1.2s infinite;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink {
  0%, 60%, 100% { opacity: 0.3; }
  30% { opacity: 1; }
}
.input-area {
  background: #F0F0F0;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.input-box {
  flex: 1;
  background: white;
  border: none;
  border-radius: 20px;
  padding: 10px 16px;
  font-size: 14px;
  color: #999;
}
.restart-btn {
  position: fixed;
  bottom: 60px;
  right: 16px;
  background: rgba(0,0,0,0.5);
  color: white;
  border: none;
  border-radius: 20px;
  padding: 8px 16px;
  font-size: 12px;
  cursor: pointer;
  z-index: 10;
}
.restart-btn:hover { background: rgba(0,0,0,0.7); }
.report-title { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
.report-section { margin-top: 8px; }
.report-label { font-weight: 600; color: #4A6FA5; font-size: 12px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">🤖</div>
  AI秘書
</div>

<div class="chat-area" id="chat"></div>

<div class="input-area">
  <div class="input-box">メッセージを入力</div>
</div>

<button class="restart-btn" onclick="restart()">もう一度見る</button>

<script>
const messages = [
  { type: "user", text: "まとめ", time: "10:00" },
  { type: "bot", text: "考え中...", time: "10:00", isThinking: true },
  { type: "bot-typing", delay: 2000 },
  { type: "bot", time: "10:02", isReport: true, text:
`秘書の〇〇です。
本日のクライアント状況を報告いたします。

━━━━━━━━━━━━━━━

▼ 田中様（株式会社ABCデザイン）
【緊急度：高】

直近のやりとり：
LINEグループにて、Webサイトリニューアルの見積もりについて「合計金額の内訳をもう少し詳しく知りたい」とご連絡がありました（本日 9:15）。

また、メールでも同件について「次回の打ち合わせまでに修正版をいただけると助かります」とのご要望をいただいております（昨日 18:23）。

→ 返信が必要です

返信案：
「田中様

いつもお世話になっております。
見積もりの内訳の件、承知いたしました。ご指摘いただいた箇所を精査し、各項目の詳細を追記した修正版を本日中にお送りいたします。

ご不明な点がございましたら、お気軽にお申し付けください。
引き続きよろしくお願いいたします。」

━━━━━━━━━━━━━━━

▼ 佐藤様（個人事業主）
【緊急度：中】

直近のやりとり：
LINEにて「SNSの投稿スケジュール、来月分も早めに決めたいです」とご連絡あり（昨日 20:45）。

→ 返信が必要です

返信案：
「佐藤さん

ご連絡ありがとうございます！
来月分の投稿スケジュール、今週中にドラフトをお送りしますね。
ご希望のテーマや強化したい内容があれば、事前に教えていただけると助かります！」

━━━━━━━━━━━━━━━

▼ 山田様（株式会社XYZコンサル）
【緊急度：低】

直近のやりとり：
LINEグループにて「先日はありがとうございました。資料拝見しました」とお礼メッセージあり。

→ 返信不要（お礼のみ）

━━━━━━━━━━━━━━━

未対応：2件（田中様・佐藤様）
対応不要：1件（山田様）` },
  { type: "user", text: "田中さんの返信案、もう少しカジュアルにして", time: "10:03" },
  { type: "bot", text: "考え中...", time: "10:03", isThinking: true },
  { type: "bot-typing", delay: 1500 },
  { type: "bot", time: "10:04", text:
`かしこまりました。田中様への返信案をカジュアルなトーンに修正いたしました。

返信案：
「田中さん

お疲れ様です！
見積もりの内訳の件、承知しました。
各項目の詳細を追記した修正版、今日中にお送りしますね。

何か気になる点があればいつでもご連絡ください！」

※田中様は意思決定が慎重な方のため、カジュアルにしつつも丁寧さは残しております。` },
];

let timeouts = [];

function restart() {
  timeouts.forEach(t => clearTimeout(t));
  timeouts = [];
  document.getElementById("chat").innerHTML = "";
  runChat();
}

function addMessage(msg) {
  const chat = document.getElementById("chat");
  const row = document.createElement("div");
  row.className = `msg-row ${msg.type === "user" ? "user" : ""}`;

  if (msg.type === "user") {
    row.innerHTML = `
      <div class="time">${msg.time}</div>
      <div class="bubble user">${msg.text}</div>
    `;
  } else {
    row.innerHTML = `
      <div class="bot-icon">🤖</div>
      <div class="bubble bot">${msg.text}</div>
      <div class="time">${msg.time}</div>
    `;
  }

  if (msg.isThinking) {
    row.dataset.thinking = "true";
  }

  chat.appendChild(row);
  requestAnimationFrame(() => {
    row.classList.add("visible");
    chat.scrollTop = chat.scrollHeight;
  });
  return row;
}

function removeThinking() {
  const chat = document.getElementById("chat");
  const thinking = chat.querySelector('[data-thinking="true"]');
  if (thinking) thinking.remove();
}

function addTyping() {
  const chat = document.getElementById("chat");
  const row = document.createElement("div");
  row.className = "msg-row visible";
  row.id = "typing-indicator";
  row.innerHTML = `
    <div class="bot-icon">🤖</div>
    <div class="typing"><span></span><span></span><span></span></div>
  `;
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById("typing-indicator");
  if (el) el.remove();
}

function runChat() {
  let delay = 500;

  messages.forEach((msg, i) => {
    if (msg.type === "bot-typing") {
      const d1 = delay;
      timeouts.push(setTimeout(() => {
        removeThinking();
        addTyping();
      }, d1));
      delay += msg.delay;
      timeouts.push(setTimeout(() => {
        removeTyping();
      }, delay));
      return;
    }

    const d = delay;
    timeouts.push(setTimeout(() => addMessage(msg), d));

    if (msg.type === "user") {
      delay += 800;
    } else if (msg.isThinking) {
      delay += 400;
    } else {
      delay += 1500;
    }
  });
}

runChat();
</script>
</body>
</html>
